name: 'Terraform Deploy'

on:
  push:
    branches:
      - main

jobs:
  terraform_apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BUCKET }}" \
            -backend-config="region=${{ vars.TF_REGION }}" \
            -backend-config="key=${{ vars.TF_KEY }}" \
            -backend-config="encrypt=true"
          terraform validate
        working-directory: ./src/aws
      
      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve -target=module.vpc.random_shuffle.az
          terraform apply -auto-approve
        working-directory: ./src/aws

      - name: Get ASG Names
        id: asg-names
        run: |
          echo "backend_asg_name=$(terraform output -raw backend_asg_name)" >> $GITHUB_OUTPUT
          echo "frontend_asg_name=$(terraform output -raw frontend_asg_name)" >> $GITHUB_OUTPUT
        working-directory: ./src/aws

  test:
    name: 'Test Backend and Frontend'
    runs-on: ubuntu-latest
    needs: terraform_apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies (Backend)
        run: |
          pip install -r requirements.txt
        working-directory: ./src/app/backend

      - name: Run Backend Tests
        run: |
          pytest tests/
        working-directory: ./src/app/backend

      - name: Install dependencies (Frontend)
        run: |
          # Placeholder for frontend dependency installation
          echo "Installing frontend dependencies..."
          # Example: npm install
        working-directory: ./src/app/frontend

      - name: Run Frontend Tests
        run: |
          # Placeholder for frontend tests
          echo "Running frontend tests..."
          # Example: npm test
        working-directory: ./src/app/frontend

  refresh_asg:
    name: 'Refresh Auto Scaling Groups'
    runs-on: ubuntu-latest
    needs: [terraform_apply, test]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/app/**

      - name: Refresh Backend ASG
        if: steps.changed-files.outputs.any_changed == 'true' && contains(steps.changed-files.outputs.all_changed_files, 'src/app/backend')
        run: |
          echo "Refreshing backend ASG: ${{ needs.terraform_apply.outputs.backend_asg_name }}"
          aws autoscaling start-instance-refresh --auto-scaling-group-name ${{ needs.terraform_apply.outputs.backend_asg_name }}

      - name: Refresh Frontend ASG
        if: steps.changed-files.outputs.any_changed == 'true' && contains(steps.changed-files.outputs.all_changed_files, 'src/app/frontend')
        run: |
          echo "Refreshing frontend ASG: ${{ needs.terraform_apply.outputs.frontend_asg_name }}"
          aws autoscaling start-instance-refresh --auto-scaling-group-name ${{ needs.terraform_apply.outputs.frontend_asg_name }}
